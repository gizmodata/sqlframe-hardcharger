name: release

# On a vX.Y.Z tag: the full CI on the tagged commit (ci.yml: the driver, lint and type checks,
# unit tests, the live suites against a real hardcharger-server, the README examples), then the
# sdist and wheel, Philip's approval (the `release` environment), PyPI through trusted publishing
# (the `pypi` environment: no token, the workflow's OIDC identity), and a GitHub Release with the
# tag's CHANGELOG section as its notes and the sdist and wheel attached.
#
# The package depends on adbc-driver-hardcharger at the floor pyproject.toml names. The build
# refuses to go on while PyPI has no such version, so a release can never publish a package
# nobody can install. CI builds the driver from a pinned commit of gizmodata/hardcharger-adbc
# (HARDCHARGER_ADBC_REF and .github/actions/hardcharger-driver): that is CI
# plumbing only, and the build checks that the wheel's metadata carries the plain floor, never a
# git pin.
#
# workflow_dispatch runs the tests and the build only; publishing needs a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Its own group: ci.yml, called below, would take `${{ github.workflow }}-${{ github.ref }}`
# with this workflow's name, so sharing a group would deadlock. A tag's release is never
# cancelled halfway.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read  # the server image the live tests run against
    secrets: inherit  # any secret ci.yml comes to use

  build:
    needs: tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - id: version
        name: The tag matches the package version, and CHANGELOG.md has its section
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: floor
        name: The driver this package depends on is on PyPI
        run: |
          set -euo pipefail
          floor=$(sed -n 's/^ *"adbc-driver-hardcharger>=\([^",]*\)".*/\1/p' pyproject.toml)
          [ -n "$floor" ] || { echo "::error::no adbc-driver-hardcharger floor in pyproject.toml"; exit 1; }
          echo "adbc-driver-hardcharger>=$floor"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "https://pypi.org/pypi/adbc-driver-hardcharger/$floor/json")
          [ "$code" = 200 ] || { echo "::error::adbc-driver-hardcharger $floor is not on PyPI (HTTP $code): publish the driver first, or raise the floor to a published version"; exit 1; }
          echo "floor=$floor" >> "$GITHUB_OUTPUT"

      - name: Build the sdist and wheel
        run: |
          python -m pip install -q build twine
          python -m build --sdist --wheel --outdir dist .
          python -m twine check --strict dist/*
          ls dist
      - name: The wheel depends on the driver by its PyPI floor, not a git pin
        env:
          FLOOR: ${{ steps.floor.outputs.floor }}
        run: |
          set -euo pipefail
          python - "$FLOOR" <<'PY'
          import glob, sys, zipfile
          floor = sys.argv[1]
          (wheel,) = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as z:
              (meta,) = [n for n in z.namelist() if n.endswith("/METADATA")]
              lines = z.read(meta).decode().splitlines()
          deps = [l for l in lines if l.startswith("Requires-Dist: adbc-driver-hardcharger")]
          print("\n".join(deps))
          if deps != [f"Requires-Dist: adbc-driver-hardcharger>={floor}"]:
              sys.exit("::error::the wheel's adbc-driver-hardcharger dependency is not the plain PyPI floor")
          PY
      # ci.yml, called above, uploads its own `dist`; this is the release build's.
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/

  # Philip's go: the `release` environment requires his approval before anything is published.
  approve:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - run: echo "release ${{ needs.build.outputs.version }} approved"

  pypi:
    needs: [build, approve]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/sqlframe-hardcharger
    permissions:
      id-token: write  # trusted publishing: PyPI's publisher names this repo, this file and the `pypi` environment
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Confirm PyPI serves the new version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/sqlframe-hardcharger/$VERSION/json" >/dev/null && exit 0
            sleep 10
          done
          echo "::error::PyPI doesn't list sqlframe-hardcharger $VERSION"; exit 1

  release:
    name: GitHub Release
    needs: [build, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ls dist/sqlframe_hardcharger-"$VERSION"-py3-none-any.whl dist/sqlframe_hardcharger-"$VERSION".tar.gz
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat release_notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: dist/*
