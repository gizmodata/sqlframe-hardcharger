name: release

# On a vX.Y.Z tag: the full CI on the tagged commit (ci.yml: the driver, lint and type checks,
# unit tests, the live suites against a real hardcharger-server, the README examples, the sdist
# and wheel), then a GitHub Release with the tag's CHANGELOG section as its notes and the sdist
# and wheel attached. There is no PyPI publish job: Hardcharger is not public yet.
#
# workflow_dispatch runs the tests and the build only; the release job needs a tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Its own group: ci.yml, called below, would take `${{ github.workflow }}-${{ github.ref }}`
# with this workflow's name, so sharing a group would deadlock.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read  # the server image the live tests run against
    secrets: inherit  # the deploy keys that build the driver

  release:
    name: GitHub Release
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: The tag matches the package version; release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $PACKAGE_VERSION"
            exit 1
          fi
          ls dist/sqlframe_hardcharger-"$VERSION"-py3-none-any.whl dist/sqlframe_hardcharger-"$VERSION".tar.gz
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat release_notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          files: dist/*
