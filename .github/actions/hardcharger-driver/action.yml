name: adbc-driver-hardcharger from source
description: >
  Builds a wheel of adbc-driver-hardcharger (gizmodata/hardcharger-adbc; until it is on PyPI)
  at a pinned commit, with its Go library, into dist-driver/. The repository and the Go modules
  it needs are public: cloned and fetched anonymously over HTTPS, no key or token.
inputs:
  ref:
    description: The hardcharger-adbc commit to build
    required: true
runs:
  using: composite
  steps:
    - name: hardcharger-adbc at ${{ inputs.ref }}
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        src="$RUNNER_TEMP/hardcharger-adbc"
        git init -q "$src"
        git -C "$src" remote add origin https://github.com/gizmodata/hardcharger-adbc
        git -C "$src" fetch -q --depth 1 origin "$REF"
        git -C "$src" checkout -q FETCH_HEAD
        test "$(git -C "$src" rev-parse HEAD)" = "$REF"
        echo "HARDCHARGER_ADBC_SRC=$src" >> "$GITHUB_ENV"
    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ runner.temp }}/hardcharger-adbc/go/go.mod
        cache: false
    - name: Library and wheel
      shell: bash
      run: |
        set -euo pipefail
        cd "$HARDCHARGER_ADBC_SRC/go"
        CGO_ENABLED=1 go build -tags driverlib -buildmode=c-shared \
          -o ../python/src/adbc_driver_hardcharger/libadbc_driver_hardcharger.so ./pkg/hardcharger
        cd "$GITHUB_WORKSPACE"
        python -m pip install -q build
        python -m build --wheel --outdir dist-driver "$HARDCHARGER_ADBC_SRC/python"
        ls -la dist-driver
